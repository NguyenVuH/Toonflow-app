name: Comic Factory validation

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: Build APK only after production acceptance gates are ready
        type: boolean
        required: true
        default: false
  push:
    branches:
      - feature/comic-factory
  pull_request:
    branches:
      - master
    paths:
      - "packages/comicFactory/**"
      - "apps/mobile/**"
      - "docs/comic-factory/**"
      - ".github/workflows/comic-factory-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comic-factory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Comic Factory contracts and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: Install dependencies
        run: bun install
      - name: Typecheck Comic Factory package
        run: bun run --cwd packages/comicFactory typecheck
      - name: Run Comic Factory tests
        run: bun test packages/comicFactory/tests

  android-debug:
    if: github.event_name == 'workflow_dispatch' && inputs.build_android == true
    name: Android ARM64 debug APK
    runs-on: windows-2025
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools
      - name: Install dependencies
        run: bun install
      - name: Prepare Android runtime and SDK dependencies
        run: bun run --cwd apps/mobile setup
      - name: Build Android ARM64 debug APK
        env:
          androidRelease: "0"
        run: bun run --cwd apps/mobile build
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: toonflow-comic-factory-android-arm64-debug
          path: build/mobile/toonflowMobile.apk
          if-no-files-found: error
          retention-days: 14
